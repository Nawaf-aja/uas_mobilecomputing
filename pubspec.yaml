name: cinego_mobile
description: "Tugas Mobile Computing - prototype aplikasi tiket bioskop CineGo."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
